    <text x="26" y="72" fill="#737373" font-size="18">Layered. Tactile.</text>
    <path d="M27 101h256" stroke="#ececec"/>
    <circle cx="36" cy="132" r="9" fill="#2f6bff"/>
    <path d="m32 132 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="139" fill="#404040" font-size="18">Review complete</text>
  </g>
  <g id="clean-surface" transform="translate(860 216)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
