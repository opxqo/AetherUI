    <text x="24" y="68" fill="#aaa" font-size="18">Precise. Focused.</text>
    <path d="M24 92h232" stroke="#fff" stroke-opacity=".1"/>
    <circle cx="30" cy="119" r="4" fill="#7aa2ff"/>
    <text x="46" y="126" fill="#c4c4c4" font-size="18">Ready for the next step</text>
  </g>
  <path d="M60 324h710" stroke="#dddde0"/>
  <g id="collection-metadata" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="372" fill="#171717" font-size="30" font-weight="600">141</text>
