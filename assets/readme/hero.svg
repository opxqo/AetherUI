<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="424" viewBox="0 0 1200 424" role="img" aria-labelledby="title description">
  <title id="title">AetherUI — React components for AI workspaces</title>
  <desc id="description">AetherUI 设计语言示意：Classic 浅色双层托盘与 Clean 深色单层表面。141 个元素、76 个双风格组件、22 个应用页面。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfcfc"/>
      <stop offset="1" stop-color="#f0f1f3"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="423" rx="24" fill="url(#canvas)" stroke="#e5e5e5"/>
  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <path d="M58 49 69 30 80 49M62 43h14" fill="none" stroke="#2f6bff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="46" fill="#6b6b6b" font-size="17" font-weight="500" letter-spacing="2">THE AI WORKSPACE COLLECTION</text>
    <text x="54" y="175" fill="#171717" font-size="104" font-weight="650" letter-spacing="-6">AetherUI</text>
    <text x="60" y="225" fill="#404040" font-size="26" letter-spacing="-.5">React components for AI workspaces.</text>
    <text x="60" y="264" fill="#737373" font-size="20">Clear states. Considered surfaces.</text>
  </g>
  <g id="classic-surface" transform="translate(674 65)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="0" y="3" width="310" height="174" rx="20" fill="#171717" opacity=".035"/>
    <rect width="310" height="174" rx="20" fill="#e9e9eb" stroke="#dedee1"/>
